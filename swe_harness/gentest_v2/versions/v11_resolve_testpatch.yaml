---
# Bash-native resolve-style regression-test generation.
# The only model-facing tool is mini-swe-agent's standard bash tool. Inspection, workspace edits,
# focused testing, patch creation, and submission all use bash; the harness intercepts the native
# submission marker and accepts it only after official Base verification.
agent:
  agent_class: bash_testpatch_resolve
  step_limit: 60
  cost_limit: 5.0
  verifier_timeout: 900
  test_command_path: /tmp/test_command
  system_template: |
    You are an experienced maintainer of this repository writing a single regression test that
    reproduces the bug described in the issue. You have one standard bash tool. Work toward an
    early first submission and use verifier feedback instead of spending the turn budget seeking
    perfect certainty.
  instance_template: |
    You are in a real shell at /testbed, checked out at the BUGGY commit: the bug is NOT fixed.
    A correct regression test should cleanly FAIL here for the issue behavior, and would pass once
    a correct fix is applied (you do not have the fix).

    <original_issue>
    {{task}}
    </original_issue>

    The repository's prepared execution environment is active and the package is importable. Do not create a
    virtualenv, reinstall, or run pip. Use only the standard bash tool throughout this task. Infer
    the repository's own focused test entrypoint and selector from current configuration, CI, and
    adjacent tests. Do not hand-build a settings module, custom runner, or standalone reproduction
    script when an adjacent repository test can exercise the behavior.

    You have at most {{ step_limit }} model turns. A submission is an iterative verifier call, not
    a claim that the candidate is perfect. As soon as you have a nonempty test-only diff, a one-line
    focused command, and an issue-related failure from that command, stop exploring: your next bash
    call must prepare /tmp/test_command and /tmp/test.patch, and the following bash call must submit
    them. Do not rerun an unchanged candidate.

    You do NOT have the fix and must not look for it. Never inspect git history, refs, branches,
    tags, remotes, commits, or `.git` internals. Do not run `git log`, `git show`, `git branch`,
    `git cat-file`, or any `git diff` against a commit or ref. For git, use only working-tree
    commands needed to create and inspect your own patch: `git status`, `git add -AN`, and plain
    `git diff`. Derive the corrected behavior only from the issue text, current buggy code, docs,
    and current tests.

    Protocol:
    1. Start with minimal repository inspection. Explore only to identify:
       - an adjacent existing test file/class and the imports or fixtures needed to exercise it;
       - the repository-native focused test command and selector form.
       Inspect implementation only when needed to confirm a public call signature or observable
       behavior. As soon as the test location and command are known, stop inspecting and edit the
       test. Do not trace lower-level internals or search for the historical fix.
    2. Edit files directly in /testbed with bash. Prefer an existing test file and its established
       imports/fixtures. Write the assertion for the CORRECTED behavior y, never the bug symptom.
       Keep assertions minimal. Run the exact focused repository-native command once. If the new
       test fails for the intended issue behavior, immediately continue to preparation and
       submission. Do not rerun the unchanged test or resume broad inspection.
    3. When the test is ready, use a separate bash call to write exactly that one-line focused
       command to /tmp/test_command. Then create the patch outside the repository:

         cd /testbed && git add -AN && git diff --no-color > /tmp/test.patch

       Inspect /tmp/test.patch. It must contain only the intended regression-test changes and must
       not be empty. Do not hand-write diff headers or hunks.
    4. Submit with exactly one final bash call:

       echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat /tmp/test.patch

       The harness will apply this patch on a clean buggy Base and run /tmp/test_command. If Base
       verification rejects it, fix the specific reported problem, recreate /tmp/test.patch, and
       submit again promptly; do not restart broad exploration. A clean issue-related Base failure
       is accepted and ends the task.

    Nothing is submitted by ordinary prose. Every response must contain a bash tool call.
model:
  extra_tools: []
  format_error_template: |
    Tool call error:

    <error>
    {{error}}
    </error>

    Every response must contain at least one standard bash tool call. Do not emit custom
    write_test_patch or submit_test_patch tool calls.
